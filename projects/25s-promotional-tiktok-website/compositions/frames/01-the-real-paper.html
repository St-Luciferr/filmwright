  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var DUR = 5.483;

      /* spacer so the timeline spans the full frame window and holds still at the end */
      tl.to({}, { duration: DUR }, 0);

      /* ---------------- Scene 1 (0.0-2.0s) — ink-black field, chrome, then 200 counts up ------- */

      /* rule stub wipes left -> right */
      tl.fromTo("#f01trp-stub", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power2.out" }, 0.06);

      /* mono kicker wipes on left -> right */
      tl.fromTo(
        "#f01trp-kicker",
        { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 },
        { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: 0.46, ease: "power2.out" },
        0.14
      );

      /* counting-dynamic-scale: value + transform scale share one position, one ease */
      var COUNT_AT = 0.15;
      var COUNT_DUR = 1.45;
      var COUNT_EASE = "power3.out";
      var START_SCALE = 0.5; /* START_SIZE 15cqw / END_SIZE 30cqw */
      var countEl = document.getElementById("f01trp-count");
      var counterState = { value: 0 };

      tl.to(
        counterState,
        {
          value: 200,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            countEl.textContent = Math.round(counterState.value).toLocaleString("en-US");
          }
        },
        COUNT_AT
      );
      tl.fromTo(
        "#f01trp-count",
        { scale: START_SCALE, opacity: 0 },
        { scale: 1, opacity: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT
      );

      /* depth layer: the vertical hairline draws down behind the numeral */
      tl.fromTo("#f01trp-vrule", { scaleY: 0 }, { scaleY: 1, duration: 1.0, ease: "power2.out" }, 0.3);

      /* ---------------- Scene 2 (2.0-3.2s) — the label sets, then 3 hours hard-cuts in --------- */

      tl.fromTo(
        "#f01trp-hairline-1",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.38, ease: "power2.out" },
        1.72
      );
      tl.fromTo(
        "#f01trp-label-1",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        1.9
      );

      /* discrete-text-sequence: whole text states swapped at thresholds, no tween between them */
      var HOURS_AT = 2.25;
      var HOURS_WINDOW = 1.0;
      var HOURS_SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.3, text: "3" },
        { t: 0.38, text: "3 hours" }
      ];
      var hoursEl = document.getElementById("f01trp-hours");
      function hoursTextAt(time) {
        for (var i = HOURS_SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= HOURS_SEQUENCE[i].t) return HOURS_SEQUENCE[i].text;
        }
        return "";
      }
      var hoursDriver = { t: 0 };
      tl.to(
        hoursDriver,
        {
          t: HOURS_WINDOW,
          duration: HOURS_WINDOW,
          ease: "none",
          onUpdate: function () {
            hoursEl.textContent = hoursTextAt(hoursDriver.t);
          }
        },
        HOURS_AT
      );

      tl.fromTo(
        "#f01trp-hairline-2",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.38, ease: "power2.out" },
        2.85
      );
      tl.fromTo(
        "#f01trp-label-2",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" },
        3.02
      );

      /* ---------------- Scene 3 (3.2-5.483s) — the penalty lands, then the frame holds --------- */

      /* spring-pop-entrance, smooth register: power3.out long-tail settle, no overshoot */

        "#f01trp-penalty",

        { scale: 1, opacity: 1, duration: 0.58, ease: "power3.out" },

        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },

      );

      /* ---------------- track 6 — the candidate (rises behind the desk, writes, then stills) --- */

      /* the desk segment wipes left -> right; hairline-3 later completes the same line across */
      tl.fromTo("#f01trp-desk", { scaleX: 0 }, { scaleX: 1, duration: 0.44, ease: "power2.out" }, 1.7);

      /* the candidate is revealed bottom-up, as if sitting up from behind the desk */
      tl.fromTo(
        "#f01trp-figure",
        { clipPath: "inset(100% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.86, ease: "power3.out" },
        1.8
      );
      tl.fromTo("#f01trp-figure-in", { y: 22 }, { y: 0, duration: 0.86, ease: "power3.out" }, 1.8);

      /* the teal pen glyph inks in over the writing hand once the plate has settled */
      tl.fromTo(
        "#f01trp-pen",
        { opacity: 0, scale: 0.72, rotation: -12 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "power3.out" },
        2.52
      );

      /* ---------------- row glyphs — each inks in on its own label's cue ------------------- */
      tl.fromTo("#f01trp-g1", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 1.9);
      tl.fromTo("#f01trp-g2", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 3.02);
      tl.fromTo("#f01trp-g3", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, 3.85);

      /* 4.27s -> 5.483s: nothing moves. The three numbers simply read. */

      window.__timelines["01-the-real-paper"] = tl;
    })();
