  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var ROW_H = 172;
      var START_PROGRESS = 0.8; // partially-spread start — short path directly into slot
      var ROW_AT = [0.95, 1.52, 2.09, 2.66, 3.23]; // one arrival per spoken subject

      /* ---------- Scene 1 (0.0-1.0) : ground chrome, kicker wipe, column hairline ---------- */

      tl.fromTo(".f04ow-top-line", { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.04);
      tl.fromTo(".f04ow-top-labels", { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" }, 0.1);
      tl.fromTo(".f04ow-bot-line", { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.16);
      tl.fromTo(".f04ow-bot-labels", { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" }, 0.22);

      // kicker wipes on left -> right
      tl.fromTo(".f04ow-kicker",
        { clipPath: "inset(0 100% 0 0)", opacity: 1, x: -14 },
        { clipPath: "inset(0 0% 0 0)", opacity: 1, x: 0, duration: 0.44, ease: "power2.out" }, 0.06);

      // svg-path-draw: the single hairline that implies the empty five-slot column
      var axis = document.getElementById("f04ow-axis-path");
      if (axis && axis.getTotalLength) {
        var aLen = axis.getTotalLength();
        axis.style.strokeDasharray = String(aLen);
        axis.style.strokeDashoffset = String(aLen);
        tl.to(axis, { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 0.15);
      }

      /* ---------- Scene 2 (1.0-3.9) : five rows assemble, one per spoken subject ---------- */

      var rows = document.querySelectorAll(".f04ow-stack .f04ow-row");
      var center = (rows.length - 1) / 2;

      rows.forEach(function (row, i) {
        var at = ROW_AT[i];
        // center-outward-expansion, direct-into-slot form: the row's offset from the
        // stack centre is its target; it starts at START_PROGRESS of that offset.
        var targetY = (i - center) * ROW_H;
        var startY = targetY * (START_PROGRESS - 1);

        tl.fromTo(row,
          { opacity: 0, x: -30, y: startY, scale: 0.972 },
          { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.52, ease: "power3.out" }, at);

        tl.fromTo(row.querySelector(".f04ow-rule"),
          { scaleX: 0 }, { scaleX: 1, duration: 0.46, ease: "power3.out" }, at);

        tl.fromTo(row.querySelector(".f04ow-value"),
          { opacity: 0, scale: 0.82 },
          { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, at + 0.06);

        // stat-bars-and-fills: width authored in CSS, scaleX from a left origin
        tl.fromTo(row.querySelector(".f04ow-bar"),
          { scaleX: 0 }, { scaleX: 1, duration: 0.58, ease: "power2.out" }, at + 0.1);

        // the subject glyph settles in with its row, one beat behind the label
        tl.fromTo(row.querySelector(".f04ow-glyph"),
          { opacity: 0, scale: 0.6 },
          { opacity: 0.9, scale: 1, duration: 0.44, ease: "power3.out" }, at + 0.08);
      });

      /* the hall rises behind the stack as the last subject lands */
      tl.fromTo("#f04ow-hall",
        { clipPath: "inset(100% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.78, ease: "power3.out" }, 3.42);
      tl.fromTo("#f04ow-hall-img",
        { y: 24 }, { y: 0, duration: 0.86, ease: "power3.out" }, 3.42);

      /* ---------- Scene 3 (3.9-5.291) : the column closes, 200 resolves ---------- */

      tl.fromTo(".f04ow-close", { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 3.88);

      tl.fromTo(".f04ow-total-label", { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 3.95);

      // counting-dynamic-scale: value + transform scale share start, duration and ease
      var COUNT_AT = 3.92, COUNT_DUR = 0.92, COUNT_EASE = "power1.out";
      var START_SCALE = 0.55;
      var totalNum = document.getElementById("f04ow-total-num");
      var ticks = document.querySelectorAll(".f04ow-stack .f04ow-tick");
      var state = { value: 0 };

      tl.fromTo(totalNum, { opacity: 0, scale: START_SCALE },
        { opacity: 1, scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

      tl.to(state, {
        value: 200,
        duration: COUNT_DUR,
        ease: COUNT_EASE,
        onUpdate: function () {
          var v = Math.round(state.value);
          totalNum.textContent = String(v);
          // the count sweeps across the five row values as it climbs
          for (var k = 0; k < ticks.length; k++) {
            ticks[k].style.opacity = v >= Number(ticks[k].dataset.cum) ? "1" : "0.16";
          }
        }
      }, COUNT_AT);

      /* ---------- settle: sine-wave-loop, low amplitude, on the total only ---------- */
      var jitter = document.getElementById("f04ow-jitter");
      var phase = { p: 0 };
      tl.to(phase, {
        p: Math.PI * 2,
        duration: 0.39,
        ease: "none",
        onUpdate: function () {
          var s = Math.sin(phase.p);
          jitter.style.transform = "translateY(" + (s * 2.5).toFixed(3) + "px) scale(" + (1 + s * 0.005).toFixed(5) + ")";
        }
      }, 4.9);

      window.__timelines["04-official-weight"] = tl;
    })();
  </script>
