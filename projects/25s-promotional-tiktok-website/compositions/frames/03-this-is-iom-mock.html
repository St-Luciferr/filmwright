  <style>
    /* ---- 03-this-is-iom-mock — Broadside TEAL register ---------------------
       ground #1DA6AB · ALL type ink #111A1A + the ink ladder (75/55/40/20).
       Flat plane: no shadow, no gradient, 0 radius (the brand mark's own bar
       radius is the mark's geometry, not a surface radius).
       Container law: #root is the sized container; every unit is cqw / cqh.
    ------------------------------------------------------------------------ */
    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      container-type: size;

    /* full-duration ground layer (never a background on #root) */

    /* ---- hairline (the single Broadside ornament / back depth layer) ---- */
    .f03iom-hair {

      left: 5.5cqw;
      top: 48.96cqh;
      width: 89cqw;

    /* ---- the lockup row: mark + wordmark column ------------------------ */
    .f03iom-lockup {
      position: absolute;
      left: 0;
      right: 0;
      /* row height == mark height (22cqw); centre of row at 30.2cqh */
      top: calc(30.2cqh - 11cqw);
      height: 22cqw;
      display: flex;

    .f03iom-wm {

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var scope = document.currentScript
        ? document.currentScript.parentNode
        : document;
      var root =
        (scope.querySelector && scope.querySelector('[data-composition-id="03-this-is-iom-mock"]')) ||
        document.querySelector('[data-composition-id="03-this-is-iom-mock"]');
      var q = function (sel) {
        return root ? root.querySelector(sel) : null;
      };
      var qa = function (sel) {
        return root ? Array.prototype.slice.call(root.querySelectorAll(sel)) : [];
      };

      var barV = q(".f03iom-bar-v");
      var barH = q(".f03iom-bar-h");
      var lockup = q(".f03iom-lockup");
      var wmGrps = qa(".f03iom-wm-grp");
      var byline = q(".f03iom-byline");
      var hair = q(".f03iom-hair");
      var words = qa(".f03iom-word");

      /* The lockup is a full-width flex row, so xPercent is a share of the
         1080px canvas. Half of (gap 3.2cqw + wordmark 47.052cqw) = 25.126cqw
         puts the mark on dead centre while the wordmark is still hidden;
         tweening back to 0 slides the mark left as the wordmark lands. */
      var LOCKUP_OFFSET = 25.126;

      /* ------------------------------------------------------------------
         SCENE 1 (0.0–1.3s) — center-outward-expansion.
         Both bars share ONE origin (the mark's centre, 12/12 in user units,
         which is the fill-box centre of each rect). Each starts collapsed at
         that shared point and radiates outward to full length. Vertical bar
         first, horizontal second. Out-eases only.
      ------------------------------------------------------------------ */
      var EXPAND_DUR = 0.66;
      var EXPAND_EASE = "power3.out";

      tl.set(lockup, { xPercent: LOCKUP_OFFSET }, 0);

      tl.fromTo(
        barV,
        { scaleY: 0.055, scaleX: 0.55, opacity: 0 },
        {
          scaleY: 1,
          scaleX: 1,
          opacity: 1,
          duration: EXPAND_DUR,
          ease: EXPAND_EASE,
        },
        0.1
      );

      tl.fromTo(
        barH,
        { scaleX: 0.055, scaleY: 0.55, opacity: 0 },
        {
          scaleX: 1,
          scaleY: 1,
          opacity: 1,
          duration: EXPAND_DUR,
          ease: EXPAND_EASE,
        },
        0.34
      );

      /* ------------------------------------------------------------------
         SCENE 2 (1.3–2.5s) — the lockup resolves.
         The mark slides left to its lockup seat while "IOM" then "Mock"
         cascade in on a staggered slide with a long-tail settle (expo.out,
         no overshoot). "by Nepsor" sets beneath in 40% ink mono chrome, and
         the 20%-ink hairline expands center-outward under the lockup.
      ------------------------------------------------------------------ */
      tl.fromTo(
        lockup,
        { xPercent: LOCKUP_OFFSET },
        { xPercent: 0, duration: 0.92, ease: "power3.out" },
        1.3
      );

      var WM_AT = 1.4;
      var WM_STAGGER = 0.17;
      var WM_FROM = [-14, -8]; /* per-group share of its own width, kept inside
                                  the 3.2cqw lockup gap so nothing collides */
      wmGrps.forEach(function (grp, i) {
        tl.fromTo(
          grp,
          { opacity: 0, xPercent: WM_FROM[i] || -8 },
          { opacity: 1, xPercent: 0, duration: 0.8, ease: "expo.out" },
          WM_AT + i * WM_STAGGER
        );
      });

      tl.fromTo(
        byline,
        { opacity: 0, yPercent: 55 },
        { opacity: 1, yPercent: 0, duration: 0.55, ease: "power3.out" },
        2.0
      );

      tl.fromTo(
        hair,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.85, ease: "power3.out" },
        1.98
      );

      /* ------------------------------------------------------------------
         SCENE 3 (2.5–4.395s) — the lead line reveals word by word.
         dynamic-content-sequencing: each word's window is BASE + chars ×
         SEC_PER_CHAR, reduced ONCE at build time into a flat table of
         absolute starts — no hardcoded per-word offsets, nothing recomputed
         per frame. After the last word the frame holds completely still.
      ------------------------------------------------------------------ */
      var LEAD_AT = 2.52;
      var BASE_DURATION = 0.055;
      var SEC_PER_CHAR = 0.012;

      var cumulative = 0;
      var SEQ = words.map(function (el) {
        var start = cumulative;
        cumulative += BASE_DURATION + el.textContent.length * SEC_PER_CHAR;
        return { el: el, start: LEAD_AT + start };
      });

      SEQ.forEach(function (item) {
        tl.fromTo(
          item.el,
          { opacity: 0, yPercent: 42 },
          { opacity: 1, yPercent: 0, duration: 0.42, ease: "power3.out" },
          item.start
        );
      });

      /* ------------------------------------------------------------------
         The student is revealed bottom-up under the lockup as the promise
         lands, then holds — the frame's stillness is unbroken.
      ------------------------------------------------------------------ */
      tl.fromTo(
        "#f03iom-figure",
        { clipPath: "inset(100% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.9, ease: "power3.out" },
        2.34
      );
      tl.fromTo(
        "#f03iom-figure-img",
        { y: 26 },
        { y: 0, duration: 0.9, ease: "power3.out" },
        2.34
      );
      tl.fromTo(
        "#f03iom-glyph",
        { opacity: 0, scale: 0.62 },
        { opacity: 1, scale: 1, duration: 0.46, ease: "power3.out" },
        2.06
      );

      /* the held breather — no exit, no drift, no jitter through 4.395s */

      window.__timelines["03-this-is-iom-mock"] = tl;
    })();
  </script>
