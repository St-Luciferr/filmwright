  <script>
    (function () {
      var FRAME_ID = "05-tutor-read-your-paper";
      var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines[FRAME_ID] = tl;

      var qTextEl = root.querySelector("#f05tutor-qtext");
      var caretQ = root.querySelector("#f05tutor-caret-q");
      var caretA = root.querySelector("#f05tutor-caret-a");
      var words = root.querySelectorAll(".f05tutor-w");

      /* ── Scene 1 (0.00–1.40) — chrome, the wrong-answer stub, the ask types ── */

      // panel top hairline wipes open
      tl.fromTo(
        "#f05tutor-hairtop",
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, duration: 0.38, ease: "power2.out" },
        0.06
      );

      // mono chrome slides in from the left margin
      tl.fromTo(
        ["#f05tutor-rulestub", "#f05tutor-kicker"],
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.36, ease: "power2.out", stagger: 0.06 },
        0.08
      );

      // the wrong-answer stub SETS — instant, no drift
      tl.fromTo(
        "#f05tutor-stub",
        { opacity: 0 },
        { opacity: 1, duration: 0.02, ease: "none" },
        0.3
      );

      // the ask block arrives (its caret is already blinking inside it)
      tl.fromTo(
        "#f05tutor-ask",
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "none" },
        0.3
      );

      // discrete-text-sequence · smooth character slice — the student types
      var ASK = "Why is my answer wrong? I picked B.";
      var typer = { n: 0 };
      var lastN = -1;
      tl.fromTo(
        typer,
        { n: 0 },
        {
          n: ASK.length,
          duration: 0.86,
          ease: "none",
          onUpdate: function () {
            var n = Math.floor(typer.n);
            if (n !== lastN) {
              lastN = n;
              qTextEl.textContent = ASK.slice(0, n);
            }
          },
        },
        0.46
      );

      // caret blink — FINITE stepped tween. k=0 -> on, k=N -> off (the clear).
      // steps(6) over 1.44s == 3 blinks at ~0.48s/cycle, then the caret is gone.
      var blinkQ = { k: 0 };
      var lastKQ = -1;
      tl.fromTo(
        blinkQ,
        { k: 0 },
        {
          k: 6,
          duration: 1.44,
          ease: "steps(6)",
          onUpdate: function () {
            var k = Math.floor(blinkQ.k);
            if (k !== lastKQ) {
              lastKQ = k;
              caretQ.style.opacity = k % 2 === 0 && k < 6 ? "1" : "0";
            }
          },
        },
        0
      );

      /* ── Scene 2 (1.40–2.60) — the seam cuts, the reply sets word by word ── */

      // the ask glyph inks in beside the student's question
      tl.fromTo(
        "#f05tutor-glyph-ask",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" },
        1.16
      );

      // the seam wipes open at the caret's own velocity
      tl.fromTo(
        "#f05tutor-seam",
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, duration: 0.34, ease: "power3.out" },
        1.4
      );

      // dynamic-content-sequencing — one word per beat across the back half
      tl.fromTo(
        words,
        { opacity: 0, yPercent: 45 },
        {
          opacity: 1,
          yPercent: 0,
          duration: 0.3,
          ease: "power2.out",
          stagger: 0.068,
        },
        1.68
      );

      // the student reading the reply back rises under the panel
      tl.fromTo(
        "#f05tutor-figure",
        { clipPath: "inset(100% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.72, ease: "power3.out" },
        1.86
      );
      tl.fromTo(
        "#f05tutor-figure-img",
        { y: 22 },
        { y: 0, duration: 0.8, ease: "power3.out" },
        1.86
      );

      /* ── Scene 3 (2.60–3.52) — the marker names the mistake, then stillness ── */

      // css-marker-patterns · highlight mode — teal sweep under "before the charge"
      tl.fromTo(
        "#f05tutor-hl",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power2.out" },
        2.8
      );

      // the answer glyph inks in as the mistake is named
      tl.fromTo(
        "#f05tutor-glyph-ans",
        { opacity: 0, scale: 0.6, rotation: -25 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.46, ease: "power3.out" },
        2.72

      // panel bottom hairline closes the block
      tl.fromTo(
        "#f05tutor-hairbot",
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        2.9
      );

      // the residual motion: the reply's caret, two finite stepped blinks.
      // k=0 -> off, so any seek before 2.86 leaves it hidden.
      var blinkA = { k: 0 };
      var lastKA = -1;
      tl.fromTo(
        blinkA,
        { k: 0 },
        {
          k: 4,
          duration: 0.66,
          ease: "steps(4)",
          onUpdate: function () {
            var k = Math.floor(blinkA.k);
            if (k !== lastKA) {
              lastKA = k;
              caretA.style.opacity = k % 2 === 1 ? "1" : "0";
            }
          },
        },
        2.86
      );

      // hold to the cut — no exit, this is not the final frame
      tl.to({}, { duration: 0.001 }, 3.519);
    })();
